# A snapshot as a Playground roll publishes one since 2026-09-19: a cluster,
# its nodes named by role, what each node declared it can do, what the run was
# started with under [run], and the topology the owner asked for — cluster,
# nodes, receive, process, send, the endpoints beneath receive and send, and
# the handoffs R -> P -> S.
