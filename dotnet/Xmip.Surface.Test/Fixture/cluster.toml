# A snapshot as a Playground roll publishes one since 2026-09-19: a cluster,
# its nodes, what each node declared it can do, what the run was started with
# under [run], and the topology the owner asked for — cluster, nodes, receive,
# process, send, the endpoints beneath receive and send, the handoffs
# receive -> process -> send, and the Parties outside (2026-09-29): the one
# that sends into the receive stages and the one the send stages deliver to.
#
# The names below are what an operator typed and nothing more (ADR-0053): a
# node's name is not a criterion, and the node called beta proves it by declaring
# two stages and serving one. Capability is what a node could do (ADR-0056),
# never what its name looks like and never what it happened to do this round.

source = "playground — xmip:///C1"
node = "xmip:///C1"

[[records]]
scope = "xmip:///C1/node/alpha/capability"
state = "fine"
severity = 0
evidence = "declares receiving; online; authentication and runtime capability are not modelled"
