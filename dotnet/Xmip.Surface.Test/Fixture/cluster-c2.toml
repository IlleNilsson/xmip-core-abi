# A second cluster rolling beside the one in cluster.toml. Two rolls are two
# clusters (ADR-0052, amendment 2026-09-14, ruling 1), each publishing its own
# file, and a face holds both at once (amendment 2026-09-20). Small on purpose:
# what it has to carry is its own [run].cluster, its own scope root and enough
# topology for a view to draw something that is plainly not C1's.

source = "playground — xmip:///C2"
node = "xmip:///C2"

[[records]]
scope = "xmip:///C2/node/delta/capability"
state = "fine"
severity = 0
evidence = "declares receive; online"
observed_unix_nanos = 1789111688000000000

[[records]]
scope = "xmip:///C2/node/delta/receive/tcp/json"
state = "fine"
severity = 0
evidence = "3/3 rounds passed"
observed_unix_nanos = 1789111688000000000

[[records]]
scope = "xmip:///C2/node/zeta/send/tcp/json"
state = "done"
severity = 95
evidence = "connection refused by billing-x (10.0.9.7:5671)"
observed_unix_nanos = 1789111688000000000

[[counts]]
