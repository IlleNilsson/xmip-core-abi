# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-abi"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-abi"
description = "Rust binding over the Xmip module boundary. The header is normative, this is not."

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
xmip-core = { git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }

[dev-dependencies]
toml = "0.9"

# The conformance fixture: a loadable module as small as conformance allows,
# built as a cdylib so xmip-core-cli's probe and xmip-core-powershell's
# Get-XmipModuleDescriptor have a conforming artifact to load.
#
#     cargo build --example conforming
#
[[example]]
name = "conforming"
crate-type = ["cdylib"]

[lints.rust]
# deny, not forbid. This is the crate that will eventually hold the `extern "C"`
# vtable over include/xmip_module.h, and forbid cannot be lifted at the one call
# site that legitimately needs it. Every use is expected to justify itself.
unsafe_code = "deny"
